<head>

    <title>Слайдер</title>

</head>
<body>

    <div class="slider">
        <!-- Кнопка "назад" -->
        <button class="slider__btn slider__btn--prev" aria-label="Предыдущий слайд">&#10094;</button>

        <!-- Дорожка со слайдами -->
        <div class="slider__track">
            <!-- Слайд 1 -->
            <div class="slider__slide">
                <img src="slides/photo_1.jpg" alt="1">
            </div>
            <!-- Слайд 2 -->
            <div class="slider__slide">
                <img src="slides/photo_2.jpg" alt="2">
            </div>
            <!-- Слайд 3 -->
            <div class="slider__slide">
                <img src="slides/photo_3.jpg" alt="3">
            </div>
            <!-- Слайд 4 -->
            <div class="slider__slide">
                <img src="slides/photo_4.jpg" alt="4">
            </div>
            <div class="slider__slide">
                <img src="slides/photo_5.jpg" alt="5">
            </div>
                <div class="slider__slide">
                <img src="slides/photo_6.jpg" alt="6">
                </div>
                <div class="slider__slide">
                <img src="slides/photo_7.jpg" alt="7">
                </div>
                 <div class="slider__slide">
                <img src="slides/photo_8.jpg" alt="8">
                </div>
                <div class="slider__slide">
                <img src="slides/photo_9.jpg" alt="9">
                </div>
            </div>
        </div>

        <!-- Кнопка "вперёд" -->
        <button class="slider__btn slider__btn--next" aria-label="Следующий слайд">&#10095;</button>

        <!-- Точки-индикаторы (создаются автоматически через JS) -->
        <div class="slider__dots"></div>
    </div>

    <script src="app.js"></script>
</body>
